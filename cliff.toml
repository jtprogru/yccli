# git-cliff конфиг — генерация changelog по conventional commits.
# Запуск:
#   git-cliff -o CHANGELOG.md            # полный changelog
#   git-cliff --latest                   # только последний релиз
#   git-cliff --unreleased               # только Unreleased секция

[changelog]
header = """
# Changelog

Все значимые изменения проекта документируются в этом файле.
Формат — [Keep a Changelog](https://keepachangelog.com/ru/1.1.0/),
версионирование — [SemVer](https://semver.org/lang/ru/).
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}\
- {{ commit.message | upper_first | trim }}\
{% if commit.breaking %} **[BREAKING]**{% endif %}
{% endfor %}\
{% endfor %}\n
"""
footer = """
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat",      group = "Added" },
  { message = "^fix",       group = "Fixed" },
  { message = "^docs",      group = "Documentation" },
  { message = "^perf",      group = "Performance" },
  { message = "^refactor",  group = "Changed" },
  { message = "^test",      group = "Tests" },
  { message = "^chore",     group = "Chore" },
  { message = "^ci",        group = "CI" },
  { message = "^build",     group = "Build" },
  { message = "^style",     skip = true },
  { body = ".*BREAKING.*",  group = "Breaking" },
]
filter_commits = true
tag_pattern = "v[0-9].*"
skip_tags = "v0.0.1"
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
